<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>기억력 카드 게임</title>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="app">
      <header class="app-header">
        <div class="title-group">
          <p class="eyebrow">MEMORY GAME</p>
          <h1>기억력 카드 게임</h1>
        </div>

        <div class="header-tools">
          <div class="move-box">
            <span>시도 횟수</span>
            <strong id="moves">0</strong>
          </div>

          <button id="restartButton" class="restart-button" type="button">
            다시 시작
          </button>
        </div>
      </header>

      <section
        id="gameBoard"
        class="board"
        aria-label="기억력 카드 16장"
      ></section>

      <!-- script.js가 필요로 하는 요소들 -->
      <div class="sr-only" aria-hidden="true">
        <span id="matches">0</span>
        <span id="timer">00:00</span>
      </div>

      <button
        id="soundButton"
        class="sr-only"
        type="button"
        aria-label="효과음 끄기"
        aria-pressed="true"
      >
        <span id="soundIcon">♪</span>
      </button>
    </main>

    <div
      class="modal"
      id="winModal"
      role="dialog"
      aria-modal="true"
      aria-labelledby="winTitle"
      hidden
    >
      <div class="modal-card">
        <p class="modal-kicker">GAME CLEAR</p>
        <h2 id="winTitle">모든 짝을 찾았어요!</h2>
        <p>대단해요! 이번 기록을 확인해 보세요.</p>

        <div class="result-row">
          <div>
            <span>시도 횟수</span>
            <strong id="finalMoves">0회</strong>
          </div>
          <div>
            <span>걸린 시간</span>
            <strong id="finalTime">00:00</strong>
          </div>
        </div>

        <button id="playAgainButton" type="button">한 번 더 하기</button>
      </div>
    </div>
  </body>
</html>
